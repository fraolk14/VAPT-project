services:
  api:
    container_name: vapt-prod-api
    image: vapt-platform-api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    volumes:
      - ./backend/app:/app/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://vapt:${POSTGRES_PASSWORD:-VAPT_Super_Secure_Prod_Pass_2026!}@db:5432/${POSTGRES_DB:-vaptdb}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-prod_vapt_jwt_secret_key_889123049182390182309}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - mailpit

  frontend:
    container_name: vapt-prod-frontend
    image: vapt-platform-frontend:latest
    build:
      context: ./frontend/vapt-ui
      dockerfile: Dockerfile
    restart: always
    ports:
      - "18080:80"
    depends_on:
      - api

  db:
    container_name: vapt-prod-db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vapt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-VAPT_Super_Secure_Prod_Pass_2026!}
      POSTGRES_DB: ${POSTGRES_DB:-vaptdb}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - vapt_prod_pgdata:/var/lib/postgresql/data

  redis:
    container_name: vapt-prod-redis
    image: redis:7-alpine
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

  mailpit:
    container_name: vapt-prod-mailpit
    image: axllent/mailpit:latest
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  vapt_prod_pgdata:
    name: vapt_prod_pgdata
