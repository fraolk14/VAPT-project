services:
  api:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://vapt:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-vaptdb}
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-me}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - greenbone_gvmd_socket:/run/gvmd:ro
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - mailpit

  frontend:
    build:
      context: ./frontend/vapt-ui
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL-}
    ports:
      - "${FRONTEND_PORT:-18080}:80"
    depends_on:
      - api

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vapt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vaptdb}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    profiles: ["extended"]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.1
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    profiles: ["extended"]

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command:
      [
        "zap.sh",
        "-daemon",
        "-host",
        "0.0.0.0",
        "-port",
        "8080",
        "-config",
        "api.key=${ZAP_API_KEY:-zap}",
        "-config",
        "api.addrs.addr.name=.*",
        "-config",
        "api.addrs.addr.regex=true"
      ]
    ports:
      - "8080:8080"
    profiles: ["extended"]

  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:latest
    ports:
      - "8001:8000"
    profiles: ["extended"]

volumes:
  greenbone_gvmd_socket:
    external: true
    name: greenbone-community-edition_gvmd_socket_vol
  pgdata:
  esdata:
