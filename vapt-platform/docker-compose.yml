services:
  api:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://vapt:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-vaptdb}
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-me}
      # Self-hosted open-source model for AI remediation (see the ollama service).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-290}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - greenbone_gvmd_socket:/run/gvmd:ro
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - mailpit

  frontend:
    build:
      context: ./frontend/vapt-ui
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL-}
    ports:
      - "${FRONTEND_PORT:-18080}:80"
    depends_on:
      - api

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vapt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vaptdb}
    volumes:
      - pgdata:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine


  mailpit:
    image: axllent/mailpit:latest



  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    profiles: ["extended"]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.1
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    profiles: ["extended"]

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    command:
      [
        "zap.sh",
        "-Xmx1536m",
        "-daemon",
        "-host",
        "0.0.0.0",
        "-port",
        "8080",
        "-config",
        "network.localServers.mainProxy.address=0.0.0.0",
        "-config",
        "network.localServers.mainProxy.port=8080",
        "-config",
        "network.localServers.mainProxy.behindNat=true",
        "-config",
        "api.key=${ZAP_API_KEY:?Set ZAP_API_KEY in .env}",
        "-config",
        "api.addrs.addr.name=.*",
        "-config",
        "api.addrs.addr.regex=true"
      ]
    # Come back on its own if the Docker VM runs short of memory and the kernel kills it;
    # otherwise every later web scan silently falls back to the built-in checks only.
    restart: unless-stopped
    profiles: ["extended"]




  mobsf:
    image: opensecurity/mobile-security-framework-mobsf:latest
    environment:
      # Pin MobSF's REST API key so the platform (MOBSF_API_KEY in .env) can authenticate.
      MOBSF_API_KEY: ${MOBSF_API_KEY:?Set MOBSF_API_KEY in .env}
    # The image's own health check calls host.docker.internal, which doesn't resolve inside
    # this container, so MobSF always showed "unhealthy". Check its own port instead.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8000/login/ || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    # No host port: the API reaches MobSF on the Docker network, and MobSF's web UI ships
    # with default credentials, so it must not be exposed on the server.
    profiles: ["extended"]

  ollama:
    # Runs the open-source model used by AI remediation, on CPU. Scan data never leaves the server.
    # First start: docker compose exec ollama ollama pull qwen3:4b-instruct-2507-q4_K_M  (about 2.5 GB)
    image: ollama/ollama:0.11.4
    environment:
      OLLAMA_KEEP_ALIVE: 10m        # unload the model after 10 idle minutes to free memory
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      # Keep memory small enough to run beside ZAP in an 8 GB Docker VM:
      # a 4K context window and an 8-bit attention cache bring the model to about 2.8 GB.
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ollama_models:/root/.ollama
    # No host port: only the API talks to the model.
    restart: unless-stopped

volumes:
  ollama_models:
  greenbone_gvmd_socket:
    name: greenbone-community-edition_gvmd_socket_vol
  pgdata:
  esdata:

